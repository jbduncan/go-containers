version: "2"
run:
  modules-download-mode: readonly
linters:
  # Disable all linters by default and only explicitly enable the ones below.
  default: none
  enable:
    - bidichk
    - dupl
    - dupword
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - ginkgolinter
    - gosec
    - govet
    - iface
    - misspell
    - modernize
    - nilnesserr
    - noctx
    - nolintlint
    - paralleltest
    - predeclared
    - recvcheck
    - revive
    - staticcheck
    - testpackage
    - unused
    - usestdlibvars
    - usetesting
  settings:
    exhaustive:
      check:
        - switch
        - map
    govet:
      enable:
        - appends
        - asmdecl
        - assign
        - atomic
        - atomicalign
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - defers
        - directive
        - errorsas
        - findcall
        - framepointer
        - hostport
        - httpmux
        - httpresponse
        - ifaceassert
        - inline
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - printf
        - reflectvaluecompare
        - shadow
        - shift
        - sigchanyzer
        - slog
        - sortslice
        - stdmethods
        - stdversion
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - timeformat
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
        - unusedwrite
        - waitgroup
    revive:
      enable-all-rules: false
      rules:
        - name: atomic
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: duplicated-imports
        - name: early-return
          arguments:
            # Do not suggest refactorings that would increase variable scope
            - preserveScope
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: filename-format
        - name: flag-parameter
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-alias-naming
          arguments:
            # Ensure aliases like "foobar" are allowed and that dot imports are
            # let through (dot imports are caught by "staticcheck").
            # However, ensure that aliases with underscores like "foo_bar" are
            # disallowed.
            - ^[a-z\.][a-z0-9]{0,}$
        - name: import-shadowing
        - name: increment-decrement
        - name: indent-error-flow
          arguments:
            # Do not suggest refactorings that would increase variable scope
            - preserveScope
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-import-alias
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
          arguments:
            # Do not suggest refactorings that would increase variable scope
            - preserveScope
        - name: time-equal
        - name: unchecked-type-assertion
        - name: unconditional-recursion
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-parameter
          arguments:
            - allowRegex: ^_
        - name: useless-break
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
formatters:
  enable:
    # gofumpt and gci are used for stricter formatting than gofmt and import sorting.
    - gci
    - gofumpt
